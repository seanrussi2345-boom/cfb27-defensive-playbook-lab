name: Diagnose offensive concept scout lab

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/offensive-concept-scout-lab
          fetch-depth: 0

      - name: Capture exact patch failure
        run: |
          set +e
          python .github/scripts/build_offensive_concept_scout_lab.py > /tmp/concept-build-output.txt 2>&1
          status=$?
          {
            echo "exit_status=$status"
            echo "--- patch output ---"
            cat /tmp/concept-build-output.txt
          } > offensive-concept-build-diagnostic.txt
          cat offensive-concept-build-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offensive-concept-build-diagnostic.txt
          git commit -m "Capture offensive concept build failure [skip ci]"
          git push origin agent/offensive-concept-scout-lab

      - name: Remove temporary diagnostic workflow
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/diagnose-offensive-concept-scout-lab.yml
          git commit -m "Remove offensive concept diagnostic workflow [skip ci]"
          git push origin main
