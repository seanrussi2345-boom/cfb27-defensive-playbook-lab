name: Apply SWR App Palette

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/apply_swr_app_palette.py'
      - '.github/workflows/apply-swr-app-palette.yml'

permissions:
  contents: write

jobs:
  apply-palette:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply black gold white palette
        run: python tools/apply_swr_app_palette.py
      - name: Validate scoped palette change
        run: |
          grep -q 'SWR APP PALETTE START' index.html
          grep -q 'width:min(1200px,calc(100% - 28px));max-width:1200px' index.html
          grep -q '#123e2a' index.html
          grep -q '#ff96d7' index.html
          ! grep -q '<iframe' index.html
          git diff --check
      - name: Remove temporary palette files
        run: |
          rm -f tools/apply_swr_app_palette.py
          rm -f .github/workflows/apply-swr-app-palette.yml
      - name: Commit palette update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Match app palette to Saturday War Room branding'
          git push
