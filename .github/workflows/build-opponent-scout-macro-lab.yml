name: Build opponent scout macro lab

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-scout-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/opponent-scout-macro-lab
          fetch-depth: 0

      - name: Build isolated scout and matchup module
        run: python .github/scripts/build_opponent_scout_macro_lab.py

      - name: Validate complete JavaScript
        run: node --check /tmp/cfb27-scout-lab.js

      - name: Commit feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/build_opponent_scout_macro_lab.py
          git add index.html README.md
          git commit -m "Add opponent scout and macro matchup lab [skip ci]"
          git push origin agent/opponent-scout-macro-lab

      - name: Remove temporary builder from main
        run: |
          git fetch origin main
          git checkout main
          git rm .github/workflows/build-opponent-scout-macro-lab.yml
          git commit -m "Remove temporary scout lab builder [skip ci]"
          git push origin main
