name: Add weekly gameplan builder

on:
  push:
    branches:
      - agent/weekly-gameplan-builder
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gameplan:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-gameplan-builder

      - name: Patch weekly gameplan builder and call sheet
        shell: python
        run: |
          from pathlib import Path

          index_path = Path('index.html')
          text = index_path.read_text(encoding='utf-8')

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one source block, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          gameplan_css = r'''
.gameplan-panel{grid-column:1/-1;padding:14px}
.gameplan-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.gameplan-head h2{margin-bottom:5px}
.gameplan-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.gameplan-btn{padding:8px 10px;border:1px solid #3b5b75;border-radius:8px;background:#102233;color:#dceeff;cursor:pointer;font-size:10px}
.gameplan-btn:hover{border-color:#65d9ef}
.gameplan-btn.primary{border-color:#4e9fbe;background:#173c52;color:#effcff}
.gameplan-btn.warn{border-color:#71424b;background:#29191e;color:#ffc7cd}
.gameplan-meta{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:9px;margin-top:12px}
.gameplan-field label{margin-top:0}
.gameplan-field input[type="text"],.gameplan-field select,.gameplan-builder textarea{
  width:100%;padding:9px 10px;color:var(--text);background:#08131f;border:1px solid #304c68;border-radius:9px;outline:none;
}
.gameplan-field input:focus,.gameplan-field select:focus,.gameplan-builder textarea:focus{border-color:var(--accent)}
.gameplan-builder textarea{min-height:78px;resize:vertical;font:inherit}
.gameplan-layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:12px;margin-top:12px;align-items:start}
.gameplan-builder,.call-sheet-shell{border:1px solid #294159;border-radius:12px;background:#08131f;padding:12px;min-width:0}
.gameplan-builder h3,.call-sheet-title strong{margin:0;color:#eaf7ff;font-size:12px}
.gameplan-current{margin-top:10px;padding:9px;border:1px dashed #35516b;border-radius:9px;background:#0b1723;color:#b8d2e7;font-size:9px;line-height:1.45;white-space:pre-line}
.gameplan-add-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.gameplan-add-actions button{min-width:0}
.call-sheet-title{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-bottom:9px;border-bottom:1px solid #23394f}
.call-sheet-title span{display:block;margin-top:3px;color:#9fb4c9;font-size:9px;line-height:1.4}
.call-sheet-count{flex:0 0 auto;padding:4px 7px;border:1px solid #3a5d7b;border-radius:999px;background:#10263a;color:#dcf6ff;font-size:8px;font-weight:850}
.call-sheet-list{display:grid;gap:7px;margin-top:9px}
.call-sheet-row{display:grid;grid-template-columns:125px minmax(0,1fr) auto;gap:9px;align-items:center;padding:9px;border:1px solid #2a435d;border-radius:10px;background:#0b1825}
.call-sheet-situation{color:#9fe9f6;font-size:9px;font-weight:900;letter-spacing:.05em;text-transform:uppercase}
.call-sheet-main{min-width:0}
.call-sheet-main strong{display:block;color:#eef7ff;font-size:10px;line-height:1.35}
.call-sheet-main span{display:block;margin-top:3px;color:#9fb4c9;font-size:8px;line-height:1.4}
.entry-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.entry-actions button{padding:5px 7px;border:1px solid #34516b;border-radius:6px;background:#101f2e;color:#dcecff;cursor:pointer;font-size:8px}
.entry-actions button:hover{border-color:#65d9ef}
.entry-actions button:disabled{opacity:.35;cursor:not-allowed}
.entry-actions .remove{border-color:#71424b;background:#29191e;color:#ffc7cd}
@media(max-width:1040px){
  .gameplan-layout{grid-template-columns:1fr}
  .gameplan-meta{grid-template-columns:1fr 1fr}
}
@media(max-width:700px){
  .gameplan-head{display:block}
  .gameplan-actions{justify-content:flex-start;margin-top:9px}
  .gameplan-meta{grid-template-columns:1fr}
  .gameplan-add-actions{grid-template-columns:1fr}
  .call-sheet-row{grid-template-columns:1fr}
  .entry-actions{justify-content:flex-start}
}
@media print{
  body{background:#fff;color:#111}
  header,.left,.center,.right,.macro-panel,.gameplan-builder,.gameplan-actions,.entry-actions,.gameplan-help,.modal-backdrop,footer{display:none!important}
  .app{display:block;width:100%;padding:0}
  .gameplan-panel{display:block!important;border:0;box-shadow:none;background:#fff;color:#111;padding:0}
  .gameplan-head{border-bottom:2px solid #111;padding-bottom:8px}
  .gameplan-head h2,.call-sheet-title strong{color:#111}
  .gameplan-meta{grid-template-columns:1.2fr 1fr 1fr;margin:10px 0 14px}
  .gameplan-field label{color:#555}
  .gameplan-field input[type="text"],.gameplan-field select{border:0;background:transparent;color:#111;padding:0;appearance:none}
  .gameplan-layout{display:block;margin:0}
  .call-sheet-shell{border:0;background:#fff;padding:0}
  .call-sheet-title{border-color:#777}
  .call-sheet-title span{color:#444}
  .call-sheet-count{border-color:#777;background:#fff;color:#111}
  .call-sheet-row{grid-template-columns:115px minmax(0,1fr);border-color:#999;background:#fff;break-inside:avoid}
  .call-sheet-situation{color:#111}
  .call-sheet-main strong{color:#111}
  .call-sheet-main span{color:#444}
}
'''

          replace_once(
              '.macro-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}\n.action{',
              '.macro-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}\n' + gameplan_css + '\n.action{'
          )

