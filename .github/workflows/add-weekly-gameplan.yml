      - name: Validate application structure
        shell: python
        run: |
          import re
          from html.parser import HTMLParser
          from pathlib import Path

          text=Path('index.html').read_text(encoding='utf-8')
          required=[
            'id="gameplanPanel"','id="gameplanOpponent"','id="gameplanSituation"',
            'id="addCurrentPlayToGameplan"','id="addSelectedMacroToGameplan"',
            'id="gameplanCallSheet"','id="printGameplan"',
            'const GAMEPLAN_STORAGE_KEY="cfb27-playbook-lab-v4-gameplan";',
            'gameplan:getGameplan()','storeGameplan(data.gameplan',
            'renderUndo();renderGameplan();','@media print'
          ]
          missing=[item for item in required if item not in text]
          if missing:raise SystemExit(f'Missing gameplan elements: {missing}')

          class IdCollector(HTMLParser):
            def __init__(self):super().__init__();self.ids=[]
            def handle_starttag(self,tag,attrs):
              for key,value in attrs:
                if key=='id':self.ids.append(value)
          parser=IdCollector();parser.feed(text)
          expected_ids=['gameplanPanel','gameplanName','gameplanOpponent','gameplanWeek','gameplanSituation','gameplanNote','addCurrentPlayToGameplan','addSelectedMacroToGameplan','gameplanCallSheet','newGameplan','printGameplan']
          for item in expected_ids:
            count=parser.ids.count(item)
            if count!=1:raise SystemExit(f'Expected one #{item}, found {count}')
          if parser.ids.count('libraryView')!=1:raise SystemExit('Existing Library View menu changed unexpectedly.')
          if parser.ids.count('macroList')!=1:raise SystemExit('Existing macro list changed unexpectedly.')

          script=re.search(r'<script>(.*)</script>',text,re.S)
          if not script:raise SystemExit('Could not extract application JavaScript.')
          Path('/tmp/cfb27-gameplan.js').write_text(script.group(1),encoding='utf-8')
          readme=Path('README.md').read_text(encoding='utf-8')
          if 'Weekly Gameplan Builder' not in readme:raise SystemExit('README was not updated.')
          print('Weekly gameplan structure validation passed.')

      - name: Validate JavaScript syntax
        run: node --check /tmp/cfb27-gameplan.js

      - name: Commit validated feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-weekly-gameplan.yml
          git add index.html README.md
          git commit -m "Add weekly gameplan builder [skip ci]"
          git push
