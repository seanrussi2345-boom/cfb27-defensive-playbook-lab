      <div class="call-sheet-shell" id="callSheetShell">
        <div class="call-sheet-title">
          <div>
            <strong id="gameplanPreviewTitle">Weekly Defensive Gameplan</strong>
            <span id="gameplanPreviewMeta">No opponent selected</span>
