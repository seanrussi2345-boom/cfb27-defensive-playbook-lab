'''

          replace_once(
              '  </section>\n  <div class="modal-backdrop" id="appModal" hidden>',
              '  </section>' + gameplan_html + '  <div class="modal-backdrop" id="appModal" hidden>'
          )

          gameplan_js = r'''
const GAMEPLAN_STORAGE_KEY="cfb27-playbook-lab-v4-gameplan";
function emptyGameplan(){
  return {name:"Weekly Defensive Gameplan",opponent:"",week:"",entries:[],updatedAt:null};
}
function normalizeGameplan(raw){
  const base=emptyGameplan();
  if(!raw||typeof raw!=="object")return base;
  const entries=(Array.isArray(raw.entries)?raw.entries:[])
    .filter(entry=>entry?.package&&PLAY_DB[entry.package.formation]?.includes(entry.package.play))
    .map((entry,index)=>({
      id:String(entry.id||`call-${index}-${Date.now()}`),
      situation:typeof entry.situation==="string"&&entry.situation.trim()?entry.situation.trim():"Base Defense",
      note:typeof entry.note==="string"?entry.note.slice(0,220):"",
      source:typeof entry.source==="string"&&entry.source.trim()?entry.source.trim():"Saved Call",
      macroSlot:Number.isInteger(entry.macroSlot)&&entry.macroSlot>=0&&entry.macroSlot<10?entry.macroSlot:null,
      package:JSON.parse(JSON.stringify(entry.package))
    }));
  return {
    name:typeof raw.name==="string"&&raw.name.trim()?raw.name.trim().slice(0,80):base.name,
    opponent:TEAM_PLAYBOOKS[raw.opponent]?raw.opponent:"",
    week:typeof raw.week==="string"?raw.week.trim().slice(0,80):"",
    entries,
    updatedAt:raw.updatedAt||null
  };
}
function getGameplan(){
  try{return normalizeGameplan(JSON.parse(localStorage.getItem(GAMEPLAN_STORAGE_KEY)||"{}"))}
  catch{return emptyGameplan()}
}
function storeGameplan(plan){
  const normalized=normalizeGameplan(plan);normalized.updatedAt=new Date().toISOString();
  localStorage.setItem(GAMEPLAN_STORAGE_KEY,JSON.stringify(normalized));return normalized;
}
function clonePackage(pkg){return JSON.parse(JSON.stringify(pkg))}
function loadPlayPackage(pkg,selectedSlot=null){
  if(!pkg||!PLAY_DB[pkg.formation]?.includes(pkg.play)){alert("That saved call is no longer available in the master play library.");return false}
  state.selectedSlot=Number.isInteger(selectedSlot)?selectedSlot:null;
  state.libraryView="ALL";state.family=familyOf(pkg.formation);state.formation=pkg.formation;state.play=pkg.play;state.strength=pkg.strength||"left";
  state.typeFilter="ALL";state.mapFilter="ALL";state.playSearch="";state.overrides={};clearUndo();
  el("libraryView").value="ALL";populateFamilies();el("family").value=state.family;populateFormations();
  el("typeFilter").value="ALL";el("mapFilter").value="ALL";el("playSearch").value="";
  populatePlays();el("strength").value=state.strength;
  if(pkg.overrides&&typeof pkg.overrides==="object")state.overrides={...pkg.overrides};
  else{
    const base=baseAssignments(clonePlayers());
    Object.entries(pkg.assignments||{}).forEach(([id,key])=>{if(base[id]!==key)state.overrides[id]=key});
  }
  state.selected=clonePlayers()[0][0];renderAll();
  requestAnimationFrame(()=>el("diagramTitle")?.scrollIntoView({behavior:"smooth",block:"center"}));
  return true;
}
function updateGameplanMeta(){
  const plan=getGameplan();
  plan.name=el("gameplanName").value;plan.opponent=el("gameplanOpponent").value;plan.week=el("gameplanWeek").value;
  storeGameplan(plan);renderGameplan();
}
function addPackageToGameplan(pkg,source,macroSlot=null){
  if(!pkg||!PLAY_DB[pkg.formation]?.includes(pkg.play)){alert("Select a valid play or saved macro first.");return}
  const plan=getGameplan();
  plan.entries.push({
    id:`call-${Date.now()}-${Math.random().toString(36).slice(2,8)}`,
    situation:el("gameplanSituation").value||"Base Defense",
    note:el("gameplanNote").value.trim(),
    source,
    macroSlot:Number.isInteger(macroSlot)?macroSlot:null,
    package:clonePackage(pkg)
  });
  storeGameplan(plan);el("gameplanNote").value="";renderGameplan();
}
function addCurrentPlayToGameplan(){
  if(!state.formation||!state.play){alert("Select a play before adding it to the gameplan.");return}
  addPackageToGameplan(snapshot(state.play),"Current Play");
}
function addSelectedMacroToGameplan(){
  const slot=state.selectedSlot,macro=Number.isInteger(slot)?getMacros()[slot]:null;
  if(!macro){alert("Select a saved macro slot first.");return}
  addPackageToGameplan(macro,`Macro ${String(slot+1).padStart(2,"0")}: ${macro.name}`,slot);
}
function moveGameplanEntry(index,direction){
  const plan=getGameplan(),target=index+direction;
  if(target<0||target>=plan.entries.length)return;
  [plan.entries[index],plan.entries[target]]=[plan.entries[target],plan.entries[index]];
  storeGameplan(plan);renderGameplan();
}
function removeGameplanEntry(index){
  const plan=getGameplan();plan.entries.splice(index,1);storeGameplan(plan);renderGameplan();
}
function newBlankGameplan(){
  const current=getGameplan();
  if(current.entries.length&&!confirm("Start a new blank weekly gameplan and remove the current call sheet?"))return;
  storeGameplan(emptyGameplan());el("gameplanNote").value="";renderGameplan();
}
function renderGameplan(){
  const plan=getGameplan(),nameInput=el("gameplanName"),weekInput=el("gameplanWeek"),opponentInput=el("gameplanOpponent");
  if(document.activeElement!==nameInput)nameInput.value=plan.name;
  if(document.activeElement!==weekInput)weekInput.value=plan.week;
  opponentInput.value=plan.opponent;
  const opponent=TEAM_PLAYBOOKS[plan.opponent]?.name||"No opponent selected";
  el("gameplanPreviewTitle").textContent=plan.name||"Weekly Defensive Gameplan";
  el("gameplanPreviewMeta").textContent=[plan.week,opponent].filter(Boolean).join(" • ");
  el("gameplanCount").textContent=`${plan.entries.length} call${plan.entries.length===1?"":"s"}`;

  const selectedMacro=Number.isInteger(state.selectedSlot)?getMacros()[state.selectedSlot]:null;
  const playText=state.formation&&state.play?`${state.formation} — ${state.play}`:"No current play selected";
  const macroText=selectedMacro?`Selected macro ${String(state.selectedSlot+1).padStart(2,"0")}: ${selectedMacro.name}`:"No macro slot selected";
  el("gameplanCurrentSummary").textContent=`Current play: ${playText}\n${macroText}`;
  el("addCurrentPlayToGameplan").disabled=!state.formation||!state.play;
  el("addSelectedMacroToGameplan").disabled=!selectedMacro;

  const list=el("gameplanCallSheet");list.innerHTML="";
  if(!plan.entries.length){
    const empty=document.createElement("div");empty.className="empty-state";empty.textContent="No calls added yet. Choose a situation, then add the current play or a selected macro.";list.appendChild(empty);return;
  }
  plan.entries.forEach((entry,index)=>{
    const row=document.createElement("article");row.className="call-sheet-row";
    const situation=document.createElement("div");situation.className="call-sheet-situation";situation.textContent=entry.situation;
    const main=document.createElement("div");main.className="call-sheet-main";
    const title=document.createElement("strong");title.textContent=`${entry.package.formation} — ${entry.package.play}`;
    const meta=document.createElement("span");
    const details=[entry.source,`Strength ${(entry.package.strength||"left").toUpperCase()}`];if(entry.note)details.push(entry.note);meta.textContent=details.join(" • ");
    main.append(title,meta);
    const actions=document.createElement("div");actions.className="entry-actions";
    const load=document.createElement("button");load.type="button";load.textContent="Load";load.onclick=()=>loadPlayPackage(entry.package,entry.macroSlot);
    const up=document.createElement("button");up.type="button";up.textContent="↑";up.title="Move up";up.disabled=index===0;up.onclick=()=>moveGameplanEntry(index,-1);
    const down=document.createElement("button");down.type="button";down.textContent="↓";down.title="Move down";down.disabled=index===plan.entries.length-1;down.onclick=()=>moveGameplanEntry(index,1);
    const remove=document.createElement("button");remove.type="button";remove.className="remove";remove.textContent="Remove";remove.onclick=()=>removeGameplanEntry(index);
    actions.append(load,up,down,remove);row.append(situation,main,actions);list.appendChild(row);
  });
}
'''

