name: Play Art Audit Artifact
on:
  pull_request:
    branches: [main]
    paths:
      - audit-output/**
      - .github/workflows/play-art-artifact.yml
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package audited play art
        uses: actions/upload-artifact@v4
        with:
          name: 3-3-5-over-flex-play-art-audit-full
          path: |
            audit-output/3-3-5-over-flex.json
            audit-output/3-3-5-over-flex.md
            audit-output/3-3-5-over-flex/*.png
            audit-output/3-3-5-over-flex/*.html
          if-no-files-found: error
          retention-days: 7
