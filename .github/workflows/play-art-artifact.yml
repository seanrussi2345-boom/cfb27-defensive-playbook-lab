name: Play Art Audit Artifact
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package audited play art
        uses: actions/upload-artifact@v4
        with:
          name: defensive-play-art-audit
          path: |
            audit-output/**/*.json
            audit-output/**/*.md
            audit-output/**/*.png
            audit-output/**/*.html
          if-no-files-found: error
          retention-days: 7
