name: Fix assignment sidebar scrolling

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-sidebar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-assignment-sidebar-scroll
          fetch-depth: 0

      - name: Remove sticky assignment sidebar behavior
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '''.right{
            position:sticky;top:82px;padding:15px;max-height:calc(100vh - 96px);overflow-y:auto;
            scrollbar-width:thin;scrollbar-color:#365773 #0a141f;
          }'''
          new = '''.right{
            position:static;padding:15px;max-height:none;overflow:visible;
          }'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one sticky .right block, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Validate layout-only change
        shell: python
        run: |
          import re
          from pathlib import Path

          text = Path('index.html').read_text(encoding='utf-8')
          if 'position:sticky;top:82px;padding:15px;max-height:calc(100vh - 96px);overflow-y:auto;' in text:
              raise SystemExit('Sticky desktop sidebar CSS still exists.')
          if '.right{\n  position:static;padding:15px;max-height:none;overflow:visible;\n}' not in text:
              raise SystemExit('Natural-flow sidebar CSS was not generated.')
          if text.count('id="gameplanPanel"') != 1:
              raise SystemExit('Gameplan panel changed unexpectedly.')
          if text.count('class="panel right assignment-sidebar"') != 1:
              raise SystemExit('Assignment panel changed unexpectedly.')
          script = re.search(r'<script>(.*)</script>', text, re.S)
          if not script:
              raise SystemExit('Could not extract application JavaScript.')
          Path('/tmp/cfb27-sidebar-fix.js').write_text(script.group(1), encoding='utf-8')
          print('Assignment sidebar layout validation passed.')

      - name: Validate JavaScript syntax
        run: node --check /tmp/cfb27-sidebar-fix.js

      - name: Commit fix branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix assignment sidebar scrolling [skip ci]"
          git push origin agent/fix-assignment-sidebar-scroll

      - name: Remove temporary workflow
        run: |
          git fetch origin main
          git checkout main
          git rm .github/workflows/fix-assignment-sidebar.yml
          git commit -m "Remove temporary sidebar fix workflow [skip ci]"
          git push origin main
