name: Replace SWR Banner

on:
  pull_request:
    branches: [main]
    paths:
      - '.banner-replacement/**'
      - 'tools/rebuild_swr_banner.py'
      - '.github/workflows/replace-swr-banner.yml'

permissions:
  contents: write

jobs:
  replace-banner:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild and verify approved banner
        run: python tools/rebuild_swr_banner.py
      - name: Validate scoped change
        run: |
          test "$(stat -c%s assets/swr-banner.webp)" = "63198"
          grep -q 'width:min(1200px,calc(100% - 28px));max-width:1200px' index.html
          ! grep -q '<iframe' index.html
          git diff --check
      - name: Remove temporary reconstruction files
        run: |
          rm -rf .banner-replacement
          rm -f tools/rebuild_swr_banner.py
          rm -f .github/workflows/replace-swr-banner.yml
      - name: Commit corrected banner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace stretched Saturday War Room banner'
          git push
