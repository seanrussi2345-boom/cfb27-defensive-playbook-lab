name: Apply SWR Branding

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/swr-banner.webp'
      - 'assets/swr-logo.webp'
      - 'tools/apply_swr_branding.py'
      - '.github/workflows/apply-swr-branding.yml'

permissions:
  contents: write

jobs:
  apply-branding:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply branding safely
        run: python tools/apply_swr_branding.py
      - name: Validate layout safeguards
        run: |
          grep -q 'SWR BRANDING START' index.html
          grep -q 'assets/swr-banner.webp' index.html
          grep -q 'assets/swr-logo.webp' index.html
          ! grep -q '<iframe' index.html
          git diff --check
      - name: Commit generated app update
        run: |
          if git diff --quiet; then
            echo 'No generated changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Integrate Saturday War Room branding'
          git push
