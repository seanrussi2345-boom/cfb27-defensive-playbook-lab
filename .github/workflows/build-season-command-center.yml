name: Build Season Command Center

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-season-command-center:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/season-command-center
          fetch-depth: 0

      - name: Build Season Command Center
        run: python .github/scripts/build_season_command_center.py

      - name: Validate complete JavaScript
        run: node --check /tmp/saturday-war-room-v5.js

      - name: Validate required profile behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text()
          required=[
            'id="seasonCommandCenter"',
            'function createSeasonProfile()',
            'function openSeasonProfile(id,scroll=true)',
            'function duplicateSeasonProfile(id)',
            'function toggleSeasonProfileArchive(id)',
            'function exportSeasonProfile(id)',
            'function importSeasonProfileFile(file)',
            'function initializeSeasonCommandCenter(forceWorkingMigration=false)',
            'seasonCommandCenter:getSeasonCommandCenter()',
            'SEASON_STORAGE_KEY'
          ]
          missing=[item for item in required if item not in text]
          if missing: raise SystemExit(f'Missing Season Command Center markers: {missing}')
          print('Season Command Center structural validation passed.')
          PY

      - name: Commit clean feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/build_season_command_center.py
          git add index.html README.md
          git commit -m "Add Season Command Center [skip ci]"
          git push origin agent/season-command-center
