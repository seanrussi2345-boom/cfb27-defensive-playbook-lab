name: Build team playbook navigator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-navigator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/team-playbook-navigator
          fetch-depth: 0

      - name: Fetch patch script from main
        run: |
          git fetch origin main
          git show origin/main:.github/scripts/build_team_playbook_navigator.py > /tmp/build_team_playbook_navigator.py

      - name: Build and validate navigator
        run: python /tmp/build_team_playbook_navigator.py

      - name: Validate JavaScript syntax
        run: node --check /tmp/cfb27-team-navigator.js

      - name: Commit feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md
          git commit -m "Add team playbook navigator [skip ci]"
          git push origin agent/team-playbook-navigator

      - name: Remove temporary builder files from main
        run: |
          git fetch origin main
          git checkout main
          git rm .github/workflows/build-team-playbook-navigator.yml .github/scripts/build_team_playbook_navigator.py
          git commit -m "Remove temporary team navigator builder [skip ci]"
          git push origin main
