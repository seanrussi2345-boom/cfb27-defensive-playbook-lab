name: Play Art Source Audit
on:
  push:
    branches: [play-art-audit]
    paths:
      - audit-input.json
      - scripts/audit_play_art.py
      - .github/workflows/play-art-audit.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: play-art-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/audit_play_art.py
      - name: Commit audit output
        run: |
          git config user.name "play-art-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add audit-output
          git diff --cached --quiet && exit 0
          git commit -m "Audit 3-3-5 Mint play-art sources"
          git push origin HEAD:play-art-audit
