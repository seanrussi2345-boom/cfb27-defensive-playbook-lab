name: Build stronger video instruction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-video-instruction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/strengthen-video-analysis-instruction
          fetch-depth: 0

      - name: Apply stronger instruction
        run: python .github/scripts/strengthen_video_analysis_instruction.py

      - name: Validate complete JavaScript
        run: node --check /tmp/cfb27-video-instruction.js

      - name: Commit clean feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/strengthen_video_analysis_instruction.py
          git add index.html
          git commit -m "Strengthen linked video analysis instruction [skip ci]"
          git push origin agent/strengthen-video-analysis-instruction
